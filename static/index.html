<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogKeate · La red de San Marcos</title>
  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- ===== Autenticacion ===== -->
<main id="vista-auth" class="auth" hidden>
    <aside class="auth-marca">
      <div class="logo"><img class="logo-img" src="/static/logo.png" alt=""><span class="logo-texto">LogKeate</span></div>
      <h1>La red social de los sanmarquinos.</h1>
      <p>Conecta con tu facultad, comparte apuntes y encuentra a quién conoces en común. Solo con correo <b>@unmsm.edu.pe</b>.</p>
    </aside>

    <section class="auth-panel">
      <div class="segmento" role="tablist">
        <button type="button" id="seg-login" class="activo">Iniciar sesión</button>
        <button type="button" id="seg-registro">Crear cuenta</button>
      </div>

      <form id="form-login">
        <label>Correo institucional<input name="email" type="email" placeholder="tucorreo@unmsm.edu.pe" required></label>
        <label>Contraseña<input name="password" type="password" placeholder="Tu contraseña" required></label>
        <button class="grande">Entrar</button>
      </form>

      <form id="form-registro" hidden>
        <label>Nombre completo<input name="nombres" placeholder="Nombres y apellidos" required maxlength="80"></label>
        <label>Código de estudiante<input name="codigo" inputmode="numeric" pattern="\d{8}" maxlength="8" placeholder="8 dígitos" required></label>
        <label>Correo institucional<input name="email" type="email" placeholder="tucorreo@unmsm.edu.pe" required></label>
        <label>Contraseña<input name="password" type="password" placeholder="8+ caracteres, letras y números" required></label>
        <label>Escuela profesional<select name="escuela_id" id="sel-escuela" required><option value="">Elige tu escuela…</option></select></label>
        <label>Ciclo<input name="ciclo" type="number" min="1" max="12" placeholder="1 a 12" required></label>
        <label>Intereses<input name="intereses" placeholder="deportes, música, ajedrez"></label>
        <button class="grande">Crear mi cuenta</button>
      </form>

      <p id="msg-auth" class="error" role="alert"></p>

    </section>
  </main>

  <!-- ===== Aplicacion ===== -->
  <div id="vista-app" hidden>
    <header class="topbar">
      <div class="logo"><img class="logo-img" src="/static/logo.png" alt=""><span class="logo-texto">LogKeate</span></div>
      <form id="form-busqueda" class="buscador" role="search" autocomplete="off">
        <svg class="lupa" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Buscar personas o grupos en LogKeate" aria-label="Buscar">
        <div id="sugerencias" class="sugerencias" hidden></div>
      </form>
      <div class="usuario-top"><span id="yo"></span><button id="btn-logout" class="sec">Salir</button></div>
    </header>

    <div class="layout">
      <nav class="menu" aria-label="Secciones">
        <button data-tab="muro" class="activo"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></span>Muro</button>
        <button data-tab="amigos"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17.5 14c2.3.2 3.5 1.9 3.5 4.5"/></svg></span>Amistades<span id="badge-amigos" class="badge" hidden></span></button>
        <button data-tab="mensajes"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v10.5H10l-4.5 3.5V16H4z"/></svg></span>Mensajes<span id="badge-msg" class="badge" hidden></span></button>
        <button data-tab="grupos"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><circle cx="5.5" cy="10" r="2.2"/><circle cx="18.5" cy="10" r="2.2"/><path d="M6.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M1.5 18c0-2 1.5-3.5 3.5-3.8"/><path d="M22.5 18c0-2-1.5-3.5-3.5-3.8"/></svg></span>Grupos</button>
        <button data-tab="perfil"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg></span>Mi perfil</button>
        <button data-tab="config"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span>Configuración</button>
      </nav>

      <main class="contenido">
        <div id="aviso-reportes" class="aviso" role="status" hidden></div>
        <p id="msg-app" class="error" role="alert"></p>
        <pre id="panel-resultado" class="codigo" hidden></pre>

        <section id="tab-muro">
          <div id="historias" class="historias"></div>
          <div id="composer-muro"></div>
          <div id="posts"></div>
        </section>

        <section id="tab-buscar" hidden>
          <div id="res-rapidos"></div>
          <div class="card">
            <h2>Filtrar personas</h2>
            <div class="fila">
              <input id="b-facultad" placeholder="Facultad (ej. FISI)">
              <input id="b-ciclo" type="number" min="1" max="12" placeholder="Ciclo mínimo">
              <input id="b-interes" placeholder="Interés (ej. deportes)">
            </div>
            <div class="fila-2">
              <select id="b-comb">
                <option value="OR">Facultad/ciclo o interés</option>
                <option value="AND">Facultad/ciclo e interés</option>
                <option value="ANDNOT">Facultad/ciclo, sin ese interés</option>
              </select>
              <button id="btn-buscar">Filtrar</button>
            </div>
          </div>
          <div id="resultados"></div>
        </section>

        <section id="tab-amigos" hidden>
          <div id="listas-amigos"></div>
        </section>

        <section id="tab-mensajes" hidden>
          <div id="vista-mensajes"></div>
        </section>

        <section id="tab-perfil" hidden>
          <div id="vista-perfil"></div>
        </section>

        <section id="tab-grupos" hidden>
          <div id="vista-grupos"></div>
        </section>

        <section id="tab-config" hidden>
          <div id="vista-config"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
